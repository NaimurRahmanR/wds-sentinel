name: One-time data byte-fidelity repair

on:
  push:
    paths:
      - ".github/workflows/repair-data.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore official BattLeDIM bytes
        shell: bash
        run: |
          set -euo pipefail
          base="https://zenodo.org/records/4017659/files"
          mkdir -p data/raw
          for file in \
            2018_Leakages.csv \
            2018_SCADA_Flows.csv \
            2018_SCADA_Levels.csv \
            2018_SCADA_Pressures.csv \
            2019_Leakages.csv \
            2019_SCADA_Flows.csv \
            2019_SCADA_Levels.csv \
            2019_SCADA_Pressures.csv
          do
            curl --fail --location --retry 3 --output "data/raw/${file}" "${base}/${file}?download=1"
          done

          cat > /tmp/battledim.md5 <<'EOF'
          c2c5fab90420da44f02e29775050abfe  data/raw/2018_Leakages.csv
          d0602c06946b46287e956f007e4264ee  data/raw/2018_SCADA_Flows.csv
          92a512d6749ddf66fd6d99f2bdde6cc4  data/raw/2018_SCADA_Levels.csv
          d389d8541350c19ff0bfc6b80f246d35  data/raw/2018_SCADA_Pressures.csv
          e1f0a43683813a90a9fec8562dde599b  data/raw/2019_Leakages.csv
          28fc99fdcbf80fcd26079e7fe602d6dc  data/raw/2019_SCADA_Flows.csv
          e5a8050bd38729e4b7648b9d52abd5b1  data/raw/2019_SCADA_Levels.csv
          5ea1e46d3f2f0a89a3f98d6fd39a851d  data/raw/2019_SCADA_Pressures.csv
          EOF
          md5sum --check /tmp/battledim.md5

      - name: Commit exact upstream bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git add data/raw
          if git diff --cached --quiet; then
            echo "No byte-level changes required."
            exit 0
          fi
          git commit -m "fix: restore exact BattLeDIM benchmark bytes"
          git push
