[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wds-sentinel"
version = "0.1.0"
description = "Reliability-aware hybrid AI supervisory prototype for water distribution system evidence." 
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.7,<2",
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wds_sentinel"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: tests that train/run against bundled BattLeDIM data",
]
