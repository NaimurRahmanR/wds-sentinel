name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint package correctness
        run: ruff check src/wds_sentinel --select E4,E7,E9,F
      - name: Test
        run: pytest -q --cov=wds_sentinel
